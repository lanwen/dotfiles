schemaVersion: "1"
agent: claude
workspace:
  path: ${{ env.projectDir }}
  clone: true

env:
  CODEDB_NO_TELEMETRY: "1"

lifecycle:
  initialize:
    - name: Create shared sandbox directory
      command: mkdir -p -- "$SBX_ENV_DIR.sbx"
  postCreate:
    - name: Allow codedb installation downloads
      command: >-
        sbx policy allow network --sandbox "$SBX_SANDBOX_NAME"
        "codedb.codegraff.com:443,api.github.com:443,github.com:443,release-assets.githubusercontent.com:443"
    - name: Install codedb inside the sandbox
      timeout: 5m
      command: |
        sbx exec -e CODEDB_NO_TELEMETRY=1 "$SBX_SANDBOX_NAME" \
          bash -c 'set -o pipefail; curl -fsSL https://codedb.codegraff.com/install.sh | bash'
    - name: Remove codedb installation host grant
      command: >-
        sbx policy rm network --sandbox "$SBX_SANDBOX_NAME"
        --resource codedb.codegraff.com:443 --force

kits:
  - docker.io/sbx/claude:latest
  - docker.io/sbx/codex-mixin:latest
  - ${{ env.fileDir }}/.config/sbx/kits/agent-updates
  # - docker.io/sbx/claude-sessions:latest
  - docker.io/sbx/mise:latest
  - ${{ env.fileDir }}/.config/sbx/kits/runtimes
  - docker.io/sbx/playwright:latest
  - docker.io/sbx/git-ssh-sign:latest
  - docker.io/sbx/github-ssh:latest

mcp:
  servers:
    - name: obsidian
      command: /opt/homebrew/bin/mise
      args:
        - exec
        - --
        - /bin/sh
        - -c
        - |
          export PATH="$PATH:/opt/homebrew/bin"
          exec /usr/bin/env OBSIDIAN_VAULT=work "$HOME/.local/bin/obsidian-cli-mcp"

additionalWorkspaces:
  - path: ${{ env.projectDir }}.sbx
  - path: /Users/lanwen/obsidian/
