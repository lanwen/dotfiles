schemaVersion: "1"
agent: claude
workspace: ${{ env.projectDir }}

env:
  CODEDB_NO_TELEMETRY: "1"

lifecycle:
  postCreate:
    - name: Allow codedb installation downloads
      command: >-
        sbx policy allow network --sandbox "$SBX_SANDBOX_NAME"
        "codedb.codegraff.com:443,api.github.com:443,github.com:443,release-assets.githubusercontent.com:443"
    - name: Install codedb inside the sandbox
      timeout: 5m
      command: |
        sbx exec -e CODEDB_NO_TELEMETRY=1 "$SBX_SANDBOX_NAME" \
          bash -c 'set -o pipefail; curl -fsSL https://codedb.codegraff.com/install.sh | bash'
    - name: Remove codedb installation host grant
      command: >-
        sbx policy rm network --sandbox "$SBX_SANDBOX_NAME"
        --resource codedb.codegraff.com:443 --force

kits:
  - docker.io/sbx/playwright-kit:latest
  - docker.io/sbx/git-ssh-sign-kit:latest
  - docker.io/sbx/github-ssh-kit:latest

mcp:
  servers:
    - name: obsidian
      command: /opt/homebrew/bin/mise
      args:
        - exec
        - --
        - /bin/sh
        - -c
        - |
          export PATH="$PATH:/opt/homebrew/bin"
          exec /usr/bin/env OBSIDIAN_VAULT=work obsidian-cli-mcp
    - name: aws
      command: /opt/homebrew/bin/mise
      args:
        - exec
        - --
        - /bin/bash
        - -c
        - |
          export PATH="$PATH:/opt/homebrew/bin"
          # The first profile is the default; each call can select another listed profile.
          export AWS_MCP_PROXY_PROFILES="bw bws uc ucs sw sws"
          # Replace the proxy's vulnerable certifi pin until an upstream release updates it.
          exec uvx --overrides <(printf '%s\n' "certifi==$CERTIFI_VERSION") "mcp-proxy-for-aws-cli@$AWS_MCP_VERSION" https://aws-mcp.us-east-1.api.aws/mcp --region us-east-1
    - name: k8s
      command: /opt/homebrew/bin/mise
      args:
        - exec
        - --
        - /bin/sh
        - -c
        - |
          export PATH="$PATH:/opt/homebrew/bin"
          # Allow this pinned release through the host's dependency cooldown.
          exec uvx --exclude-newer-package "kubernetes-mcp-server=$K8S_RELEASE_CUTOFF" "kubernetes-mcp-server@$K8S_MCP_VERSION" --config "$HOME/.config/kubernetes-mcp-server/config.toml"

additionalWorkspaces:
  - path: /Users/lanwen/obsidian/
